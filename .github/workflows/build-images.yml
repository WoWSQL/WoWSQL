name: Build & Push Docker Images

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag (e.g. 1.2.0)'
        required: true

env:
  REGISTRY: docker.io
  ORG: wowsql

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      push: ${{ steps.v.outputs.push }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tag=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

  build-studio:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ needs.version.outputs.push == 'true' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Skip push when Docker Hub secrets are missing
        if: ${{ needs.version.outputs.push == 'true' && (secrets.DOCKERHUB_USERNAME == '' || secrets.DOCKERHUB_TOKEN == '') }}
        run: |
          echo "::warning::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not set — building without push."
          echo "push=false" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v5
        with:
          context: ./studio
          push: ${{ needs.version.outputs.push == 'true' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
          load: ${{ !(needs.version.outputs.push == 'true' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '') }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8080
            NEXT_PUBLIC_KONG_URL=http://localhost:8080
            NEXT_PUBLIC_WS_URL=ws://localhost:8080
            NEXT_PUBLIC_DASHBOARD_URL=http://localhost:3000
            NEXT_PUBLIC_SELF_HOSTED=true
          tags: |
            ${{ env.ORG }}/studio:latest
            ${{ env.ORG }}/studio:${{ needs.version.outputs.tag }}
          platforms: ${{ (needs.version.outputs.push == 'true' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}

  build-self-backend:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ needs.version.outputs.push == 'true' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ needs.version.outputs.push == 'true' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
          load: ${{ !(needs.version.outputs.push == 'true' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '') }}
          tags: |
            ${{ env.ORG }}/self-backend:latest
            ${{ env.ORG }}/self-backend:${{ needs.version.outputs.tag }}
          platforms: ${{ (needs.version.outputs.push == 'true' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
